name: Gerar APK do app do motorista

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar a pasta do app
        run: |
          mkdir -p app/www
          cp apk-package.json app/package.json
          cp apk-capacitor.config.json app/capacitor.config.json
          echo '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://nucleofulfillment.github.io/deltadis/motorista.html"></head><body>Abrindo o DELTADIS Motorista...</body></html>' > app/www/index.html

      - name: Instalar Capacitor
        working-directory: app
        run: npm install

      - name: Criar o projeto Android
        working-directory: app
        run: npx cap add android

      - name: Liberar camera e localizacao
        working-directory: app
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' $F
          grep -n "uses-permission" $F

      - name: Sincronizar
        working-directory: app
        run: npx cap sync android

      - name: Gerar o APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DELTADIS-Motorista-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
